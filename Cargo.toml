[package]
name = "datafusion-functions-json"
version = "0.54.3"
edition = "2021"
description = "JSON functions for DataFusion"
readme = "README.md"
license = "Apache-2.0"
keywords = ["datafusion", "JSON", "SQL"]
categories = ["database-implementations", "parsing"]
repository = "https://github.com/datafusion-contrib/datafusion-functions-json/"
# TEMPORARY: raised from 1.88.0 to match the MSRV of `apache/datafusion` main
rust-version = "1.94.0"

[dependencies]
# TEMPORARY: track unreleased DataFusion, see the note at the bottom of this file
datafusion = { git = "https://github.com/apache/datafusion.git", branch = "main", default-features = false, features = [
    "sql",
] }
jiter = "0.15.0"
log = "0.4"
paste = "1"
serde_json = "1"

[dev-dependencies]
codspeed-criterion-compat = "2.6"
# TEMPORARY: track unreleased DataFusion, see the note at the bottom of this file
datafusion = { git = "https://github.com/apache/datafusion.git", branch = "main", default-features = false, features = [
    "nested_expressions",
    "sql",
] }
tokio = { version = "1.43", features = ["full"] }

[lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"

# in general, we lint against the pedantic group, but we will whitelist
# certain lints which we don't want to enforce (for now)
pedantic = { level = "deny", priority = -1 }

[[bench]]
name = "main"
harness = false

# TEMPORARY — do not release from this branch.
#
# The `datafusion` dependencies above point at `apache/datafusion` main rather than a published
# version, so breakage from unreleased DataFusion changes shows up here instead of during the
# upgrade after a release. `cargo publish` rejects git dependencies, so this branch cannot be
# released as-is: when the next DataFusion is out, swap both entries back to
# `{ version = "<next>", default-features = false, features = [...] }` and restore `rust-version`.
#
# A `[patch.crates-io]` entry (as previously stubbed out here) is deliberately not used: a patch
# only applies while the git version still satisfies the `version = "..."` requirement, so the
# moment main bumps its major the patch would be silently dropped and CI would go back to testing
# the released version.
